name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-latest is the only matrix row: on the macos-14 hosted image the
    # xcodebuild test step consistently fails to run the test runner (exit 65,
    # no failing test names in the log) while every other step passes — the
    # same class of runner-image test breakage as actions/runner-images#10309,
    # on a label GitHub has since deprecated. macos-latest is the row that
    # "fails loudly" when Apple breaks the SkyLight private API (see the
    # SkyLightSmokeTests comments), so it alone covers the canary intent.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -1d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install dependencies
        run: brew install xcodegen swift-format

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Lint
        run: swift-format lint --recursive Sources Tests

      - name: Build
        run: |
          xcodebuild build \
            -project SpaceLabeler.xcodeproj \
            -scheme SpaceLabeler \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO

      - name: Test
        # tee keeps the full xcodebuild output in the Actions log; pipefail
        # preserves the step exit code through the pipe so failures still
        # fail the step. The result bundle + log are uploaded on failure so
        # a future environment breakage is diagnosable from the run page.
        run: |
          set -o pipefail
          xcodebuild test \
            -project SpaceLabeler.xcodeproj \
            -scheme SpaceLabeler \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath build/Test.xcresult \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO 2>&1 | tee test-output.log

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            test-output.log
            build/Test.xcresult
          if-no-files-found: ignore
